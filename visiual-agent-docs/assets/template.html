<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">

  <title>visual-agent-docs</title>
  <style>
    :root {
      color-scheme: light dark;
      --canvas: #f3f5f8;
      --surface: #ffffff;
      --surface-muted: #e9edf3;

      --danger: #a23838;
      --shadow: 0 8px 24px rgb(35 48 70 / 8%);

      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {

        --line: #3b4654;

    * { box-sizing: border-box; }
    html { background: var(--canvas); }

      margin: 0;

    button { color: inherit; }
    button:focus-visible, textarea:focus-visible, summary:focus-visible,
    [role="button"]:focus-visible {

      outline-offset: 2px;

    .header-inner { padding: .9rem 0 .7rem; }
    .brand-row, .header-actions, .section-heading, .detail-header,
    .feedback-header, .comment-footer, .mobile-switch { display: flex; gap: .75rem; }
    .brand-row, .section-heading, .detail-header, .feedback-header, .comment-footer {

    .brand-mark {

      font-size: .78rem;
      font-weight: 800;

    .brand-mark::before {

    .source-line, .small-meta, .eyebrow { color: var(--muted); font-size: .78rem; }

      gap: 2rem;
      align-items: end;

    .overview-meta dt { color: var(--muted); }
    .overview-meta dd {

      font: .72rem/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;

    .notice-stack { display: grid; gap: .6rem; margin: 0 0 1rem; }

    .spec-detail-panel .detail-grid { grid-template-columns: 1fr; }

    .diagram-svg .diagram-edge-label { fill: var(--accent-ink); font: 600 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .diagram-svg .diagram-lane { fill: color-mix(in srgb, var(--surface-muted) 62%, var(--surface)); stroke: var(--line); stroke-width: 1; }
    .diagram-svg .diagram-legend-line { stroke: var(--accent); stroke-width: 2; }

    .diagram-text { margin: .65rem 0 0; padding-top: .55rem; border-top: 1px solid var(--line); }

    .boundary-label.in { color: var(--ok); }
    .boundary-label.out { color: var(--danger); }
    .boundary-label.unknown { color: var(--warn); }
    .status-label { color: var(--muted); }
    .synthetic-label { color: var(--accent-ink); }
    .feedback-panel { padding: 1rem; box-shadow: none; }
    .feedback-header { align-items: center; }
    .feedback-list { display: grid; gap: .7rem; margin: .9rem 0; }
    .feedback-entry { padding: .75rem; border-left: 3px solid var(--accent); background: var(--surface-muted); border-radius: 4px; }
    .feedback-entry h3 { margin: 0 0 .18rem; font-size: .9rem; }
    .feedback-entry p { margin: .2rem 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .feedback-entry .small-meta { display: block; overflow-wrap: anywhere; }
    .feedback-export { min-height: 12rem; margin-top: .8rem; }
    .old-snapshots { margin-top: 1rem; padding-top: .9rem; border-top: 1px solid var(--line); }
    .old-snapshots h3 { margin: 0 0 .25rem; font-size: .88rem; }
    .old-snapshots p { margin: 0 0 .55rem; color: var(--muted); font-size: .76rem; }
    .old-list { display: flex; flex-wrap: wrap; gap: .45rem; }
    .old-export { margin-top: .65rem; }
    .empty-state { padding: .85rem; color: var(--muted); border: 1px dashed var(--line); border-radius: 7px; }
    .muted { color: var(--muted); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .notes-dialog { width: min(42rem, calc(100% - 1.5rem)); max-height: min(85dvh, 52rem); padding: 0; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 24px 80px rgb(14 23 38 / 28%); }
    .notes-dialog::backdrop { background: rgb(13 19 29 / 42%); }
    .dialog-inner { padding: 1.1rem; overflow: auto; }
    .dialog-header { display: flex; align-items: flex-start; justify-content: space-between; gap: .8rem; margin-bottom: .85rem; }
    .dialog-header h2 { margin: 0; font-size: 1.2rem; }
    .dialog-header p { margin: .2rem 0 0; color: var(--muted); font-size: .8rem; }
    .dialog-close { min-width: 2.35rem; padding: .35rem .55rem; }
    @media (max-width: 760px) {
      .header-inner, .main-inner { width: min(100% - 1.2rem, var(--content-width)); }
      .brand-row, .section-heading, .detail-header, .feedback-header, .comment-footer { flex-direction: column; align-items: stretch; }
      .header-actions { justify-content: flex-start; }
      .overview { grid-template-columns: 1fr; gap: 1rem; }
      .spec-workspace { display: block; }
      .spec-map-panel, .spec-detail-panel { position: static; max-height: none; overflow: visible; }
      .spec-detail-panel { display: none; }
      .spec-workspace[data-mobile-view="detail"] .spec-map-panel { display: none; }
      .spec-workspace[data-mobile-view="detail"] .spec-detail-panel { display: block; }
      .mobile-switch { display: flex; }
      .spec-back { display: inline-flex; }
      .detail-grid { grid-template-columns: 1fr; }
      .action-button { width: fit-content; }
      .wizard-list { grid-template-columns: 1fr; }
      .plan-tasks-workspace { grid-template-columns: 1fr; }
      .plan-mainline-panel { position: static; max-height: none; overflow: visible; }
      .task-context-button { min-height: 2.6rem; }
    }
    @media (max-width: 520px) {
      .diagram { padding: .7rem; }
      .diagram-svg-desktop { display: none; }
      .diagram-svg-mobile { display: block; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand-row">
        <div>
          <div class="brand-mark">VISUAL AGENT DOCS</div>
          <p id="source-line" class="source-line">Offline review snapshot</p>
        </div>
        <div class="header-actions">
          <button id="current-note-button" class="action-button" type="button">Notes for this item</button>
          <button id="feedback-shortcut" class="action-button" type="button">All feedback</button>
        </div>
      </div>
      <nav id="view-tabs" class="view-tabs" role="tablist" aria-label="Review views"></nav>
    </div>
  </header>

  <main id="main-content" class="main-inner">
    <section class="overview" aria-labelledby="page-title">
      <div>
        <p id="page-eyebrow" class="eyebrow">Spec review preview</p>
        <h1 id="page-title" class="page-title"></h1>
        <p id="page-summary" class="page-summary"></p>
      </div>
      <details class="source-disclosure">
        <summary>Source and snapshot information</summary>
        <dl class="overview-meta">
          <dt>Snapshot</dt><dd id="snapshot-id"></dd>
          <dt>Source root</dt><dd id="source-root"></dd>
          <dt>Review status</dt><dd id="storage-status">Notes not loaded</dd>
        </dl>
      </details>
    </section>
    <div id="notices" class="notice-stack" aria-live="polite"></div>
    <section id="view-panel" class="view-panel" aria-live="polite"></section>
  </main>

  <dialog id="notes-dialog" class="notes-dialog" aria-labelledby="dialog-title">
    <div class="dialog-inner">
      <div class="dialog-header">
        <div>
          <h2 id="dialog-title">Notes</h2>
          <p id="dialog-subtitle"></p>
        </div>
        <button id="dialog-close" class="action-button dialog-close" type="button" aria-label="Close">×</button>
      </div>
      <div id="dialog-content"></div>
    </div>
  </dialog>

  <script id="review-data" type="application/json">__REVIEW_DATA__</script>
  <script>
    (() => {
      "use strict";

      const dataNode = document.getElementById("review-data");
      let DATA;
      try {
        DATA = JSON.parse(dataNode.textContent || "{}");
      } catch (error) {
        document.getElementById("view-panel").textContent = "Review data could not be parsed.";
        return;
      }

      const labels = {
        spec: "Spec",
        plan: "Plan",
        todo: "Todo",
        "plan-tasks": "Plan + Todo",
        feedback: "All feedback",
        in: "In scope",
        out: "Out of scope",
        unknown: "Unclear"
      };
      const state = {
        view: defaultView(),
        selectedKey: null,
        selectedPlanKey: null,
        selectedTaskKey: null,
        comments: new Map(),
        storage: { state: "unknown", message: "Notes not loaded" },
        storageBlocked: false,
        lastList: null,
        mobileView: "map",
        dialogMode: null,
        dialogTriggerId: null
      };
      const byKey = new Map();
      const byToyId = new Map((DATA.toys || []).map((toy) => [toy.id, toy]));

      function itemKey(item) {
        return item.uiKey || item.stableKey || "";
      }
      for (const doc of DATA.documents || []) {
        for (const item of doc.items || []) {
          if (itemKey(item)) byKey.set(itemKey(item), item);
        }
      }

      function availableKinds() {
        return [...new Set((DATA.documents || []).map((doc) => doc.kind))];
      }

      function defaultView() {
        const kinds = availableKinds();
        if (kinds.includes("spec")) return "spec";
        if (kinds.includes("plan") && kinds.includes("todo")) return "plan-tasks";
        if (kinds.includes("plan")) return "plan";
        if (kinds.includes("todo")) return "todo";
        return "feedback";
      }

      function visibleTabKinds() {
        const kinds = availableKinds();
        const views = [];
        if (kinds.includes("spec")) views.push("spec");
        if (kinds.includes("plan") && kinds.includes("todo")) views.push("plan-tasks");
        else {
          if (kinds.includes("plan")) views.push("plan");
          if (kinds.includes("todo")) views.push("todo");
        }
        return views.concat("feedback");
      }

      function setText(node, value) {
        if (node) node.textContent = value == null ? "" : String(value);
      }

      function make(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text != null) node.textContent = text;
        return node;
      }

      function allItems(kind) {
        const result = [];
        for (const doc of DATA.documents || []) {
          if (doc.kind !== kind) continue;
          for (const item of doc.items || []) result.push({ doc, item });
        }
        return result;
      }

      function planTaskRelations() {
        return (DATA.relations || []).filter((relation) => relation.type === "plan-task");
      }

      function mappedTasksForPlan(planItem) {
        const planKey = itemKey(planItem);
        return planTaskRelations()
          .filter((relation) => !relation.issue && relation.fromKey === planKey && relation.toKey)
          .map((relation) => ({ relation, item: byKey.get(relation.toKey) }))
          .filter(({ item }) => item && item.kind === "todo");
      }

      function mappedTodoKeys() {
        return new Set(mappedTasksForPlanItems().map(({ relation }) => relation.toKey));
      }

      function mappedTasksForPlanItems() {
        return planTaskRelations()
          .filter((relation) => !relation.issue && relation.fromKey && relation.toKey)
          .map((relation) => ({ relation, item: byKey.get(relation.toKey) }))
          .filter(({ item }) => item && item.kind === "todo");
      }

      function unmappedTodoItems() {
        const mapped = mappedTodoKeys();
        return allItems("todo").filter(({ item }) => !mapped.has(itemKey(item)));
      }

      function stepNumber(item) {
        if (item.kind === "spec") return 0;
        return allItems(item.kind).findIndex(({ item: candidate }) => itemKey(candidate) === itemKey(item)) + 1;
      }

      function itemCaption(item) {
        const source = item.source || {};
        const lineText = source.lines && source.lines.length === 2 ? `Lines ${source.lines[0]}-${source.lines[1]}` : "Line unknown";
        const number = stepNumber(item);
        return `${number ? `Step ${number} · ` : ""}${item.itemId} · ${lineText}`;
      }

      function docLabel(doc) {
        return `${labels[doc.kind] || doc.kind} · ${doc.path}`;
      }

      function setStorage(message, status) {
        state.storage = { state: status || "unknown", message };
        setText(document.getElementById("storage-status"), message);
        const field = document.querySelector(".storage-state");
        if (field) {
          setText(field, message);
          field.className = `storage-state ${status === "warn" ? "warn" : status === "ok" ? "ok" : ""}`;
        }
      }

      function storageKey(snapshotId) {
        return `visual-agent-docs:${snapshotId}:comments`;
      }

      function commentPayload() {
        const entries = [];
        for (const [key, value] of state.comments) {
          if (!value || !String(value.text || "").trim() || !byKey.has(key)) continue;
          const item = byKey.get(key);
          entries.push({
            key,
            text: String(value.text),
            snapshotId: DATA.snapshotId,
            docId: item.source && item.source.docId,
            itemId: item.itemId,
            title: item.title,
            kind: item.kind,
            stepNumber: stepNumber(item),
            sourceVersion: item.source && item.source.sourceVersion,
            source: item.source
          });
        }
        return { version: 1, snapshotId: DATA.snapshotId, entries };
      }

      function validStoredEntry(entry) {
        return entry && typeof entry === "object" &&
          ["key", "text", "docId", "itemId", "title", "kind"].every((key) => typeof entry[key] === "string") &&
          ["spec", "plan", "todo"].includes(entry.kind) &&
          (!Object.prototype.hasOwnProperty.call(entry, "snapshotId") || entry.snapshotId === DATA.snapshotId) &&
          entry.source && ["path", "sourceVersion", "anchor"].every((key) => typeof entry.source[key] === "string") &&
          (!Object.prototype.hasOwnProperty.call(entry, "sourceVersion") || entry.sourceVersion === entry.source.sourceVersion) &&
          Array.isArray(entry.source.lines) && entry.source.lines.every(Number.isInteger);
      }

      function persistComments() {
        if (state.storageBlocked) {
          setStorage("Stored notes are damaged or cannot be mapped; original data preserved. Copy new notes manually.", "warn");
          return;
        }
        try {
          window.localStorage.setItem(storageKey(DATA.snapshotId), JSON.stringify(commentPayload()));
          setStorage("Temporarily saved in this browser", "ok");
        } catch (error) {
          setStorage("Not saved persistently; closing this page will lose it. Please copy it.", "warn");
        }
      }

      function loadComments() {
        try {
          const raw = window.localStorage.getItem(storageKey(DATA.snapshotId));
          if (!raw) {
            setStorage("No saved notes", "unknown");
            return;
          }
          const parsed = JSON.parse(raw);
          if (!parsed || parsed.version !== 1 || parsed.snapshotId !== DATA.snapshotId || !Array.isArray(parsed.entries) || !parsed.entries.every(validStoredEntry)) {
            state.storageBlocked = true;
            setStorage("Note data format is invalid and was not restored. Check it and copy manually.", "warn");
            return;
          }
          let skipped = false;
          for (const entry of parsed.entries) {
            const item = byKey.get(entry.key);
            if (!item || item.mappingError || entry.key !== item.stableKey ||
                entry.snapshotId && entry.snapshotId !== DATA.snapshotId ||
                entry.docId !== item.source.docId || entry.itemId !== item.itemId || entry.kind !== item.kind ||
                entry.source.docId !== item.source.docId || entry.source.path !== item.source.path ||
                entry.source.sourceVersion !== item.source.sourceVersion ||
                entry.sourceVersion && entry.sourceVersion !== item.source.sourceVersion) {
              skipped = true;
              state.storageBlocked = true;
              continue;
            }
            if (entry.text.trim()) state.comments.set(entry.key, { text: entry.text });
          }
          setStorage(skipped ? "Some notes could not be mapped to this snapshot. Check and copy them." : "Notes restored for this snapshot", skipped ? "warn" : "ok");
        } catch (error) {
          state.storageBlocked = true;
          setStorage("Notes could not be read and were not restored. Copy current notes before closing.", "warn");
        }
      }

      function oldSnapshots() {
        const snapshots = [];
        try {
          const prefix = "visual-agent-docs:";
          for (let index = 0; index < window.localStorage.length; index += 1) {
            const key = window.localStorage.key(index);
            if (!key || !key.startsWith(prefix) || key === storageKey(DATA.snapshotId)) continue;
            try {
              const parsed = JSON.parse(window.localStorage.getItem(key));
              if (!parsed || parsed.version !== 1 || typeof parsed.snapshotId !== "string" || key !== storageKey(parsed.snapshotId) || !Array.isArray(parsed.entries) || !parsed.entries.every(validStoredEntry)) throw new Error("invalid snapshot");
              snapshots.push(parsed);
            } catch (error) {
              setStorage("Some old snapshot data is damaged; isolated but not deleted. Current notes are unaffected.", "warn");
            }
          }
        } catch (error) {
          return [];
        }
        return snapshots;
      }

      function renderNotices() {
        const host = document.getElementById("notices");
        host.replaceChildren();
        for (const message of DATA.errors || []) host.appendChild(make("div", "notice", message));
      }

      function renderTabs() {
        const host = document.getElementById("view-tabs");
        host.replaceChildren();
        for (const kind of visibleTabKinds()) {
          const button = make("button", "tab-button", labels[kind]);
          button.type = "button";
          button.setAttribute("role", "tab");
          button.dataset.view = kind;
          button.setAttribute("aria-selected", state.view === kind ? "true" : "false");
          button.setAttribute("aria-controls", "view-panel");
          host.appendChild(button);
        }
      }

      function updateHeaderActions() {
        const note = document.getElementById("current-note-button");
        if (!note) return;
        const item = state.selectedKey && byKey.get(state.selectedKey);
        note.disabled = !item || state.view === "feedback";
        note.title = item && state.view !== "feedback" ? `Write notes for "${item.title}"` : "Select an item first";
      }

      function updateMapSelection() {
        for (const node of document.querySelectorAll("[data-map-key]")) {
          const selected = node.dataset.mapKey === state.selectedKey;
          if (node.matches(".graph-node")) {
            node.setAttribute("aria-current", selected ? "true" : "false");
            node.setAttribute("aria-pressed", selected ? "true" : "false");
          } else node.setAttribute("aria-current", selected ? "true" : "false");
        }
      }

      function focusDetailHeading() {
        const heading = document.getElementById("detail-heading");
        if (heading) {
          heading.setAttribute("tabindex", "-1");
          heading.focus();
        }
      }

      function focusSelectedMapNode() {
        const node = [...document.querySelectorAll("[data-map-key]")].find((candidate) => candidate.dataset.mapKey === state.selectedKey);
        if (node) node.focus();
      }

      function focusIntegratedHeading() {
        const heading = document.getElementById(state.selectedTaskKey ? "task-detail-heading" : "integrated-plan-heading");
        if (heading) {
          heading.setAttribute("tabindex", "-1");
          heading.focus();
        }
      }

      function selectItem(key, focusDetail) {
        if (!byKey.has(key)) return;
        const selected = byKey.get(key);
        state.selectedKey = key;
        if (state.view === "plan-tasks") {
          if (selected.kind === "plan") {
            state.selectedPlanKey = key;
            state.selectedTaskKey = null;
          } else if (selected.kind === "todo") {
            state.selectedTaskKey = key;
            const relation = planTaskRelations().find((candidate) => !candidate.issue && candidate.toKey === key && candidate.fromKey);
            if (!state.selectedPlanKey && relation) state.selectedPlanKey = relation.fromKey;
          }
          renderCurrentView();
          if (focusDetail) focusIntegratedHeading();
          return;
        }
        const workspace = document.querySelector(".spec-workspace");
        if (state.view === "spec" && workspace) {
          const item = byKey.get(key);
          const detailHost = document.getElementById("spec-detail");
          updateMapSelection();
          if (detailHost) {
            detailHost.replaceChildren(renderDetail(item, []));
            if (window.matchMedia && window.matchMedia("(max-width: 760px)").matches) {
              workspace.dataset.mobileView = "detail";
            }
          }
          updateHeaderActions();
          if (focusDetail) focusDetailHeading();
          return;
        }
        renderCurrentView();
        if (focusDetail) focusDetailHeading();
      }

      function makeItemButton(doc, item, index, extraClass) {
        const button = make("button", extraClass || "item-button");
        button.type = "button";
        button.dataset.key = itemKey(item);
        button.dataset.index = String(index);
        const selectedKey = state.view === "plan-tasks" && item.kind === "plan" ? state.selectedPlanKey : state.selectedKey;
        button.setAttribute("aria-current", selectedKey === itemKey(item) ? "true" : "false");
        const label = make("span", "item-label", item.title);
        const meta = make("span", "item-meta", itemCaption(item));
        button.append(label, meta);
        if (item.summary) button.appendChild(make("span", "item-summary", item.summary));
        const flags = make("span", "small-meta");
        if (item.boundary && item.kind === "spec") flags.appendChild(make("span", `boundary-label ${item.boundary}`, labels[item.boundary]));
        if (item.status) flags.appendChild(make("span", "status-label", `Source status: ${item.status}`));
        if (item.mappingError) flags.appendChild(make("span", "status-label", "Mapping error"));
        if (flags.childNodes.length) button.appendChild(flags);
        return button;
      }

      function renderItemGroups(kind, className) {
        const host = make("div", className || "");
        const docs = (DATA.documents || []).filter((doc) => doc.kind === kind);
        if (!docs.length) {
          host.appendChild(make("p", "empty-state", `${labels[kind]} not provided.`));
          return host;
        }
        let flatIndex = 0;
        for (const doc of docs) {
          const group = make("section", "doc-group");
          const heading = make("div", "doc-heading");
          heading.append(make("h3", "", docLabel(doc)), make("span", "", `${doc.items.length} items`));
          const list = make("ol", "item-list");
          for (const item of doc.items || []) {
            const li = make("li");
            li.appendChild(makeItemButton(doc, item, flatIndex));
            list.appendChild(li);
            flatIndex += 1;
          }
          group.append(heading, list);
          host.appendChild(group);
        }
        return host;
      }

      function endpointLabel(endpoint) {
        const found = allItems("spec").concat(allItems("plan"), allItems("todo")).find(({ doc, item }) => doc.docId === endpoint.docId && item.itemId === endpoint.itemId);
        return found ? `${found.item.title} (${found.doc.path})` : `${endpoint.docId} / ${endpoint.itemId}`;
      }

      function renderRelations() {
        const list = make("ul", "relation-text-list");
        if (!(DATA.relations || []).length) {
          list.appendChild(make("li", "empty-state", "No explicit relationships were provided by the source, so no connections are added."));
          return list;
        }
        for (const relation of (DATA.relations || []).filter((candidate) => candidate.type !== "plan-task")) {
          const li = make("li");
          const from = make("button", "map-text-button", endpointLabel(relation.from));
          from.type = "button";
          from.dataset.key = relation.fromKey || "";
          from.disabled = !relation.fromKey || !byKey.has(relation.fromKey);
          const to = make("button", "map-text-button", endpointLabel(relation.to));
          to.type = "button";
          to.dataset.key = relation.toKey || "";
          to.disabled = !relation.toKey || !byKey.has(relation.toKey);
          li.append(from, make("span", "", ` → ${relation.label} → `), to);
          if (relation.issue) li.appendChild(make("p", "relation-issue", relation.issue));
          list.appendChild(li);
        }
        return list;
      }

      const WIDE_CHAR_PATTERN = /^[\u1100-\u115F\u2014\u2015\u2E80-\u303E\u3041-\u33FF\u3400-\u4DBF\u4E00-\u9FFF\uA000-\uA4CF\uAC00-\uD7A3\uF900-\uFAFF\uFE10-\uFE6F\uFF00-\uFF60\uFFE0-\uFFE6]$/u;

      function charWidthUnits(char) {
        return WIDE_CHAR_PATTERN.test(char) ? 2 : 1;
      }

      function displayWidth(value) {
        let total = 0;
        for (const char of String(value == null ? "" : value)) total += charWidthUnits(char);
        return total;
      }

      function graphText(value, max) {
        const text = String(value || "");
        if (displayWidth(text) <= max) return text;
        const kept = [];
        let used = 0;
        for (const char of text) {
          const width = charWidthUnits(char);
          if (used + width > max - 1) break;
          used += width;
          kept.push(char);
        }
        return `${kept.join("").replace(/\s+$/, "")}…`;
      }

      function fitSvgText(node) {
        const full = node.getAttribute("data-full-text");
        const max = Number(node.getAttribute("data-fit-width"));
        if (full == null || !(max > 0) || typeof node.getComputedTextLength !== "function") return;
        node.textContent = full;
        let width = 0;
        try {
          width = node.getComputedTextLength();
        } catch (error) {
          return;
        }
        if (!width || width <= max) return;
        const chars = Array.from(full);
        const clipped = (count) => `${chars.slice(0, count).join("").replace(/\s+$/, "")}…`;
        let keep = Math.max(1, Math.min(chars.length - 1, Math.floor(chars.length * (max / width)) - 1));
        node.textContent = clipped(keep);
        while (keep > 1 && node.getComputedTextLength() > max) {
          keep -= 1;
          node.textContent = clipped(keep);
        }
        for (let step = 0; step < 8 && keep < chars.length - 1; step += 1) {
          const previous = node.textContent;
          node.textContent = clipped(keep + 1);
          if (node.getComputedTextLength() > max) {
            node.textContent = previous;
            break;
          }
          keep += 1;
        }
      }

      function fitSvgTextIn(root) {
        for (const node of root.querySelectorAll("text[data-full-text]")) fitSvgText(node);
      }

      function svgElement(tag, attrs, text) {
        const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [name, value] of Object.entries(attrs || {})) node.setAttribute(name, value);
        if (text != null) node.textContent = text;
        return node;
      }

      function renderSpecGraph() {
        const figure = make("figure", "graph-figure");
        figure.appendChild(make("figcaption", "sr-only", "Spec scope and relationship map"));

      function renderCommentEditor(parent, item, inputId) {

      function syncCommentEditors(key, origin) {

          });
        };
        const mappingSvg = (mobile) => {
          const width = mobile ? 200 : 640;
          const nodeWidth = mobile ? 168 : 208;
          const nodeX = mobile ? 16 : 48;
          const laneX = mobile ? 4 : 24;
          const laneWidth = mobile ? 192 : 272;
          const labelLimit = mobile ? 12 : 22;
          const descriptionLimit = mobile ? 16 : 34;
          const grouped = { plan: nodes.filter((node) => node.lane === "plan"), task: nodes.filter((node) => node.lane === "task") };
          const metrics = new Map(nodes.map((node) => [node.id, textMetrics(node, labelLimit, descriptionLimit)]));
          if ([...metrics.values()].some((entry) => entry.labelLines.length > 4 || entry.descriptionLines.length > 4)) return null;
          const positions = new Map();
          const lanePositions = {};
          let planTop;
          let taskTop;
          if (mobile) {
            planTop = 16;
            let y = planTop + 36;
            for (const node of grouped.plan) {
              positions.set(node.id, { node, metrics: metrics.get(node.id), x: nodeX, y });
              y += metrics.get(node.id).height + 24;
            }
            const planBottom = y - 24;
            taskTop = planBottom + 56;
            y = taskTop + 36;
            for (const node of grouped.task) {
              positions.set(node.id, { node, metrics: metrics.get(node.id), x: nodeX, y });
              y += metrics.get(node.id).height + 24;
            }
            lanePositions.plan = { x: laneX, y: planTop, width: laneWidth, bottom: planBottom + 16, labelY: planTop + 20 };
            lanePositions.task = { x: laneX, y: taskTop, width: laneWidth, bottom: y - 8, labelY: taskTop + 20 };
          } else {
            planTop = 16;
            taskTop = 16;
            for (const lane of ["plan", "task"]) {
              let y = 52;
              for (const node of grouped[lane]) {
                const x = lane === "plan" ? nodeX : 384;
                positions.set(node.id, { node, metrics: metrics.get(node.id), x, y });
                y += metrics.get(node.id).height + 24;
              }
              lanePositions[lane] = { x: lane === "plan" ? 24 : 344, y: 16, width: 272, bottom: y + 8, labelY: 36 };
            }
          }
          const contentBottom = Math.max(lanePositions.plan.bottom, lanePositions.task.bottom);
          const legendText = mobile ? "Plan top / Task bottom\nExplicit mappings only\nDashed = pending review" : "Plan left / Task right\nExplicit mappings only\nDashed = pending review";
          const legendLines = wrapText(legendText, mobile ? 24 : 52);
          const legendHeight = Math.max(52, legendLines.length * 16 + 20);
          const height = contentBottom + legendHeight;
          return createSvg(mobile ? "mobile" : "desktop", width, height, (svg, markerId) => {
            const group = svgElement("g");
            for (const lane of ["plan", "task"]) {
              const laneInfo = lanePositions[lane];
              group.appendChild(svgElement("rect", { class: "diagram-lane", x: laneInfo.x, y: laneInfo.y, width: laneInfo.width, height: laneInfo.bottom - laneInfo.y, rx: 8 }));
              appendSvgText(group, "diagram-lane-label", [mobile ? (lane === "plan" ? "Plan (top)" : "Task (bottom)") : lane === "plan" ? "Plan" : "Task"], mobile ? width / 2 : laneInfo.x + laneInfo.width / 2, laneInfo.labelY, { "text-anchor": "middle" });
            }
            const connected = new Set();
            resolvedEdges.forEach(({ from, to }) => { connected.add(from.id); connected.add(to.id); });
            resolvedEdges.forEach(({ from, to, edge }, index) => {
              const source = positions.get(from.id);
              const target = positions.get(to.id);
              if (mobile) {
                const sourceX = source.x + nodeWidth * (0.3 + (index % 3) * 0.2);
                const targetX = target.x + nodeWidth * (0.7 - (index % 3) * 0.2);
                const corridorX = 4 + index * 8;
                const startY = source.y + source.metrics.height;
                const endY = target.y;
                const radius = 8;
                const d = `M ${sourceX} ${startY} H ${corridorX + radius} Q ${corridorX} ${startY} ${corridorX} ${startY + radius} V ${endY - radius} Q ${corridorX} ${endY} ${corridorX + radius} ${endY} H ${targetX}`;
                group.appendChild(svgElement("path", { class: "diagram-edge", d, "marker-end": `url(#${markerId})` }));
                appendMaskedLabel(group, wrapText(edge.label || "Mapping", 12), 24 + (index % 3) * 56, lanePositions.task.y - 20, 64);
              } else {
                const sourceRight = source.x + nodeWidth;
                const targetLeft = target.x;
                if (Math.abs(source.y + source.metrics.height / 2 - (target.y + target.metrics.height / 2)) < 1) {
                  const centerY = source.y + source.metrics.height / 2;
                  group.appendChild(svgElement("path", { class: "diagram-edge", d: `M ${sourceRight} ${centerY} H ${targetLeft}`, "marker-end": `url(#${markerId})` }));
                  appendMaskedLabel(group, wrapText(edge.label || "Mapping", 16), (sourceRight + targetLeft) / 2 - 40, centerY - 14, 96);
                } else {
                  const sourceY = source.y + source.metrics.height / 2;
                  const targetY = target.y + target.metrics.height / 2;
                  const baseCorridor = (sourceRight + targetLeft) / 2;
                  const corridor = Math.max(sourceRight + 20, Math.min(targetLeft - 20, baseCorridor + (index % 3 - 1) * 16));
                  const direction = targetY >= sourceY ? 1 : -1;
                  const radius = 8;
                  const d = direction > 0
                    ? `M ${sourceRight} ${sourceY} H ${corridor - radius} Q ${corridor} ${sourceY} ${corridor} ${sourceY + radius} V ${targetY - radius} Q ${corridor} ${targetY} ${corridor + radius} ${targetY} H ${targetLeft}`
                    : `M ${sourceRight} ${sourceY} H ${corridor + radius} Q ${corridor} ${sourceY} ${corridor} ${sourceY - radius} V ${targetY + radius} Q ${corridor} ${targetY} ${corridor - radius} ${targetY} H ${targetLeft}`;
                  group.appendChild(svgElement("path", { class: "diagram-edge", d, "marker-end": `url(#${markerId})` }));
                  appendMaskedLabel(group, wrapText(edge.label || "Mapping", 16), Math.min(corridor - 48, targetLeft - 88), sourceY - 14, 96);
                }
              }
            });
            for (const node of nodes) {
              const position = positions.get(node.id);
              appendNode(group, node, position.metrics, position.x, position.y, nodeWidth, !connected.has(node.id) ? "diagram-node-isolated" : "", !connected.has(node.id) ? "Unconnected" : "");
            }
            const legendY = height - legendHeight + 16;
            appendSvgText(group, "diagram-legend-text", legendLines, mobile ? 8 : 32, legendY + 4);
            svg.appendChild(group);
          });
        };
        const desktop = layout === "flow" ? flowSvg(false) : mappingSvg(false);
        const mobile = layout === "flow" ? flowSvg(true) : mappingSvg(true);
        if (!desktop || !mobile) {
          fallback("Long text exceeds the current limited layout; full text is retained below");
          return;
        }
        figure.append(desktop, mobile);
        appendTextAlternative(figure, false);
        parent.appendChild(figure);
      }

      function renderToy(parent, toyId) {
        if (!toyId) return;
        const toy = byToyId.get(toyId);
        if (!toy) {
          parent.appendChild(make("p", "notice", `Toy not found: ${toyId}`));
          return;
        }
        const section = make("section", "toy");
        section.append(make("h3", "", toy.title), make("p", "", toy.description || ""), make("span", "synthetic-label", "Synthetic example"));
        const frame = document.createElement("iframe");
        frame.title = `${toy.title}, synthetic example`;
        frame.setAttribute("sandbox", "allow-scripts");
        frame.setAttribute("loading", "lazy");
        frame.srcdoc = toy.html;
        section.appendChild(frame);
        parent.appendChild(section);
      }

      function appendListBlock(parent, title, values) {
        if (!values || !values.length) return;
        const block = make("section", "detail-block");
        block.appendChild(make("h3", "", title));
        const list = make("ul");
        for (const value of values) list.appendChild(make("li", "", value));
        block.appendChild(list);
        parent.appendChild(block);
      }

      function safeDomId(value) {
        return String(value || "item").replace(/[^a-zA-Z0-9_-]+/g, "-").replace(/^-+|-+$/g, "") || "item";
      }

      function renderDetail(item, positionItems, options = {}) {
        const card = make("article", `detail-card${options.className ? ` ${options.className}` : ""}`);
        const header = make("div", "detail-header");
        const headingGroup = make("div");
        const heading = make("h2", "detail-heading", item.title);
        heading.id = options.headingId || "detail-heading";
        headingGroup.append(make("p", "detail-kicker", `${labels[item.kind] || item.kind} · ${itemCaption(item)}`), heading);
        if (!options.embedded && !options.hideBack) {
          const back = make("button", item.kind === "spec" ? "action-button spec-back" : "action-button", item.kind === "spec" ? "Back to map" : "Back to item list");
          back.type = "button";
          back.addEventListener("click", returnToList);
          header.append(headingGroup, back);
        } else header.appendChild(headingGroup);
        card.appendChild(header);
        if (item.summary) card.appendChild(make("p", "detail-summary", item.summary));
        if (item.example) {
          const example = make("section", "detail-example");
          example.append(make("h3", "", "Concrete example"), make("p", "", item.example));
          card.appendChild(example);
        }
        const grid = make("div", "detail-grid");
        if (item.kind === "spec") {
          const block = make("section", "detail-block");
          block.append(make("h3", "", "This item's scope"), make("p", `boundary-value ${item.boundary || "unknown"}`, labels[item.boundary] || labels.unknown));
          grid.appendChild(block);
        }
        if (item.details) {
          const block = make("section", "detail-block");
          block.append(make("h3", "", "How to understand"), make("p", "", item.details));
          grid.appendChild(block);
        }
        if (item.status) {
          const block = make("section", "detail-block");
          block.append(make("h3", "", "Source status"), make("p", "", item.status));
          grid.appendChild(block);
        }
        appendListBlock(grid, "Limitations and risks", item.risks);
        appendListBlock(grid, "Acceptance / checks", item.acceptance);
        appendListBlock(grid, "Open questions", item.questions);
        if (grid.childNodes.length) card.appendChild(grid);
        if (item.pseudocode) {
          const block = make("section", "detail-block pseudocode-block");
          block.append(make("h3", "", "Pseudo code"), make("pre", "pseudo-code", item.pseudocode));
          card.appendChild(block);
        }
        renderDiagram(card, item.diagram);
        renderToy(card, item.toyId);
        renderSource(card, item);
        renderCommentEditor(card, item, options.inputId || "comment-input");
        if (positionItems.length && options.showNavigation !== false) {
          const actions = make("div", "detail-actions");
          const index = positionItems.findIndex(({ item: candidate }) => itemKey(candidate) === itemKey(item));
          const previousKey = adjacentKey(positionItems, itemKey(item), -1);
          const nextKey = adjacentKey(positionItems, itemKey(item), 1);
          const previous = make("button", "action-button", "Previous");
          previous.type = "button";
          previous.disabled = !previousKey;
          previous.addEventListener("click", () => { if (previousKey) selectItem(previousKey, true); });
          const next = make("button", "action-button primary", "Next");
          next.type = "button";
          next.disabled = !nextKey;
          next.addEventListener("click", () => { if (nextKey) selectItem(nextKey, true); });
          actions.append(previous, next);
          if (index === positionItems.length - 1) actions.appendChild(make("span", "small-meta", "You have reached the last item. Open “All feedback” to collect notes."));
          card.appendChild(actions);
        }
        return card;
      }

      function adjacentKey(items, currentKey, offset) {
        const index = items.findIndex(({ item }) => itemKey(item) === currentKey);
        const nextIndex = index + offset;
        return index >= 0 && nextIndex >= 0 && nextIndex < items.length ? itemKey(items[nextIndex].item) : null;
      }

      function ensureSelection(items) {
        if (!items.length) return null;
        const current = items.find(({ item }) => itemKey(item) === state.selectedKey);
        return current ? current.item : items[0].item;
      }

      function returnToList() {
        const workspace = document.querySelector(".spec-workspace");
        if (workspace) {
          workspace.dataset.mobileView = "map";
          state.mobileView = "map";
          for (const button of workspace.querySelectorAll("button[data-spec-view]")) button.setAttribute("aria-selected", button.dataset.specView === "map" ? "true" : "false");
          updateHeaderActions();
          focusSelectedMapNode();
          return;
        }
        const button = [...document.querySelectorAll(".item-button")].find((node) => node.dataset.key === state.selectedKey);
        if (button) button.focus();
      }

      function renderWizard(kind) {
        const items = allItems(kind);
        const wrapper = make("div", "wizard");
        const heading = make("div", "section-heading");
        const copy = make("div");
        copy.append(make("h2", "", `${labels[kind]} steps`), make("p", "", "Review in document order. Next only moves the reading position; it does not mean complete or approved."));
        heading.appendChild(copy);
        wrapper.appendChild(heading);
        const listPanel = make("section", "panel");
        const list = renderItemGroups(kind, "wizard-list");
        listPanel.appendChild(list);
        listPanel.id = "wizard-list";
        state.lastList = listPanel;
        wrapper.appendChild(listPanel);
        const selected = ensureSelection(items);
        if (!selected) {
          wrapper.appendChild(make("p", "empty-state", `${labels[kind]} not provided.`));
          return wrapper;
        }
        state.selectedKey = itemKey(selected);
        wrapper.appendChild(renderDetail(selected, items));
        return wrapper;
      }

      function relationSourceLabel(relation) {
        const source = relation.source || {};
        return `${source.docId || "Unknown source"} · ${source.path || "Unknown path"} · ${formatLines(source.lines)} · Anchor: ${source.anchor || "Unknown"}`;
      }

      function renderPlanTaskIssues() {
        const issues = planTaskRelations().filter((relation) => relation.issue);
        if (!issues.length) return null;
        const section = make("section", "mapping-issues");
        section.appendChild(make("h3", "", "Mapping needs review"));
        section.appendChild(make("p", "muted", "These relationships retain their original endpoints and errors, but are not treated as task mappings."));
        const list = make("ul");
        for (const relation of issues) {
          const row = make("li");
          const from = endpointLabel(relation.from);
          const to = endpointLabel(relation.to);
          row.append(make("strong", "", `${from} → ${to}`), make("p", "mapping-source", `Type: ${relation.type || "Not provided"} · ${relation.issue}`));
          if (relation.source) row.appendChild(make("p", "mapping-source", `Relationship source: ${relationSourceLabel(relation)}`));
          list.appendChild(row);
        }
        section.appendChild(list);
        return section;
      }

      function renderTaskDetail(relation, task, pending) {
        const section = make("section", pending ? "pending-task" : "mapped-task");
        const taskKey = itemKey(task);
        const button = make("button", "task-context-button", `${itemCaption(task)} · ${task.title}`);
        button.type = "button";
        button.dataset.key = taskKey;
        button.setAttribute("aria-current", state.selectedTaskKey === taskKey ? "true" : "false");
        button.setAttribute("aria-controls", `task-card-${safeDomId(taskKey)}`);
        section.appendChild(button);
        if (pending) section.appendChild(make("p", "mapping-source", "Pending review: no explicit type=plan-task mapping found."));
        else {
          section.appendChild(make("p", "mapping-source", `Explicit relationship: type=plan-task · ${relation.label || "Relationship"}`));
          if (relation.source) section.appendChild(make("p", "mapping-source", `Relationship source: ${relationSourceLabel(relation)}`));
        }
        const detail = renderDetail(task, [], {
          embedded: true,
          className: state.selectedTaskKey === taskKey ? "task-detail-card selected-task-detail" : "task-detail-card",
          headingId: state.selectedTaskKey === taskKey ? "task-detail-heading" : `task-detail-${safeDomId(taskKey)}`,
          inputId: `task-comment-${safeDomId(taskKey)}`,
          hideBack: true,
          showNavigation: false
        });
        detail.id = `task-card-${safeDomId(taskKey)}`;
        section.appendChild(detail);
        return section;
      }

      function renderPendingTasks() {
        const pending = unmappedTodoItems();
        const pendingSection = make("section", "pending-section");
        pendingSection.appendChild(make("h3", "", "Pending-review tasks"));
        pendingSection.appendChild(make("p", "muted", "Todo/Task items without a valid explicit mapping remain readable, can have separate notes, and can be exported."));
        if (!pending.length) pendingSection.appendChild(make("p", "empty-state", "All saveable Todo/Task items already have explicit mappings."));
        else pending.forEach(({ item }) => pendingSection.appendChild(renderTaskDetail(null, item, true)));
        return pendingSection;
      }

      function renderPlanTaskDetail(plan, planItems) {
        const host = make("div", "plan-task-detail");
        host.appendChild(renderDetail(plan, planItems, {
          className: "plan-detail-card",
          headingId: "integrated-plan-heading",
          inputId: "plan-comment-input",
          hideBack: true
        }));
        const mapping = make("section", "mapping-section");
        mapping.appendChild(make("h3", "", "This step's explicit tasks"));
        mapping.appendChild(make("p", "muted", "Only source-declared type=plan-task relationships are used; no mapping is inferred from titles or labels."));
        const mapped = mappedTasksForPlan(plan);
        if (!allItems("todo").length) mapping.appendChild(make("p", "empty-state", "No Todo/Task document was provided in this review set, so this Plan has no task to map."));
        else if (!mapped.length) mapping.appendChild(make("p", "empty-state", "This Plan step has no explicit task mapping; it remains visible. See the pending-review area for unmapped items."));
        else mapped.forEach(({ relation, item }) => mapping.appendChild(renderTaskDetail(relation, item, false)));
        host.appendChild(mapping);

        host.appendChild(renderPendingTasks());
        const issues = renderPlanTaskIssues();
        if (issues) host.appendChild(issues);
        return host;
      }

      function renderPlanMainline(items) {
        const panel = make("section", "panel plan-mainline-panel");
        panel.appendChild(make("h2", "", "Plan mainline"));
        panel.appendChild(make("p", "panel-help", "Order follows each Plan's source; items with the same number remain separate by document identity."));
        const docs = (DATA.documents || []).filter((doc) => doc.kind === "plan");
        if (!docs.length) {
          panel.appendChild(make("p", "empty-state", "Plan not provided."));
          return panel;
        }
        let index = 0;
        for (const doc of docs) {
          const group = make("section", "doc-group");
          group.appendChild(make("div", "doc-heading", ""));
          const heading = group.querySelector(".doc-heading");
          heading.append(make("h3", "", docLabel(doc)), make("span", "", `${doc.items.length} steps`));
          const list = make("ol", "item-list");
          for (const item of doc.items || []) {
            const li = make("li");
            const button = makeItemButton(doc, item, index);
            const mappedCount = mappedTasksForPlan(item).length;
            button.appendChild(make("span", "mapping-count", mappedCount ? `${mappedCount} explicit tasks` : "No explicit tasks yet"));
            li.appendChild(button);
            list.appendChild(li);
            index += 1;
          }
          group.appendChild(list);
          panel.appendChild(group);
        }
        return panel;
      }

      function renderPlanTasks() {
        const planItems = allItems("plan");
        const wrapper = make("div", "plan-tasks-view");
        const heading = make("div", "section-heading");
        const copy = make("div");
        copy.append(make("h2", "", "Plan + Todo integrated review"), make("p", "", "Plan steps are ordered on the left; the selected step, explicit tasks, sources, and separate notes remain on the right. Next only moves the reading position; it does not mean complete or approved."));
        heading.appendChild(copy);
        wrapper.appendChild(heading);
        const workspace = make("div", "plan-tasks-workspace");
        const selected = state.selectedPlanKey && byKey.get(state.selectedPlanKey) && byKey.get(state.selectedPlanKey).kind === "plan"
          ? byKey.get(state.selectedPlanKey)
          : ensureSelection(planItems);
        if (!selected) {
          const detailPanel = make("section", "panel plan-task-detail-panel");
          detailPanel.append(make("h2", "", "Plan has no reviewable steps."), make("p", "muted", "No Plan mainline is available; all Todo/Task items remain in the pending-review area of the same flow."), renderPendingTasks());
          const issues = renderPlanTaskIssues();
          if (issues) detailPanel.appendChild(issues);
          workspace.append(renderPlanMainline(planItems), detailPanel);
          wrapper.appendChild(workspace);
          return wrapper;
        }
        state.selectedPlanKey = itemKey(selected);
        state.selectedKey = state.selectedTaskKey && byKey.has(state.selectedTaskKey) ? state.selectedTaskKey : itemKey(selected);
        if (state.selectedTaskKey && !mappedTasksForPlan(selected).some(({ item }) => itemKey(item) === state.selectedTaskKey)) state.selectedTaskKey = null;
        const detailPanel = make("section", "panel plan-task-detail-panel");
        detailPanel.appendChild(renderPlanTaskDetail(selected, planItems));
        workspace.append(renderPlanMainline(planItems), detailPanel);
        wrapper.appendChild(workspace);
        return wrapper;
      }

      function renderSpec() {
        const wrapper = make("div", "spec-workspace");
        wrapper.dataset.mobileView = state.mobileView;
        const items = allItems("spec");
        const selected = ensureSelection(items);
        if (selected) state.selectedKey = itemKey(selected);

        const mapPanel = make("section", "spec-map-panel");
        const heading = make("div", "map-heading");
        heading.append(make("h2", "", "Spec reading map"), make("p", "", "This is a reading map for one Spec, not a module or dependency graph. See the overview first, then select a topic; the details on the right do not replace the map."));
        mapPanel.appendChild(heading);
        const legend = make("div", "map-legend");
        for (const boundary of ["in", "out", "unknown"]) {
          const item = make("span", "legend-item");
          item.append(make("span", `legend-swatch ${boundary}`), make("span", "", labels[boundary]));
          legend.appendChild(item);
        }
        mapPanel.append(legend, renderSpecGraph(), renderSpecTextMap());

        const detailPanel = make("aside", "spec-detail-panel");
        const switcher = make("div", "mobile-switch");
        for (const view of ["map", "detail"]) {
          const button = make("button", "action-button", view === "map" ? "Map" : "Current item");
          button.type = "button";
          button.dataset.specView = view;
          button.setAttribute("aria-selected", wrapper.dataset.mobileView === view ? "true" : "false");
          switcher.appendChild(button);
        }
        detailPanel.append(make("h2", "", "Current item"), make("p", "panel-help", "First review what it changes and how it behaves, then see examples, limitations, and acceptance. Source details and long hashes are below."));
        const detailHost = make("div", "");
        detailHost.id = "spec-detail";
        if (selected) detailHost.appendChild(renderDetail(selected, []));
        else detailHost.appendChild(make("p", "empty-state", "Spec has no reviewable items."));
        detailPanel.appendChild(detailHost);
        wrapper.append(switcher, mapPanel, detailPanel);
        return wrapper;
      }

      function formatLines(lines) {
        return lines && lines.length === 2 ? `Lines ${lines[0]}-${lines[1]}` : "Line unknown";
      }

      function exportEntries(entries, snapshotId) {
        if (!entries.length) return `# ${DATA.title}\n\nSnapshot: ${snapshotId}\n\nNo notes yet.`;
        const lines = [`# ${DATA.title}`, "", `Snapshot: ${snapshotId}`, "", "The following is review feedback. Verify it against the document and item identifiers:", ""];
        for (const entry of entries) {
          lines.push(`## ${entry.title || entry.itemId || "Unnamed item"}`);
          lines.push(`Document: ${entry.docId || "Unknown document"}`);
          lines.push(`Kind: ${labels[entry.kind] || entry.kind || "Unknown"}`);
          lines.push(`Item: ${entry.itemId || "Unknown"}`);
          if (entry.kind !== "spec") lines.push(entry.stepNumber ? `Step ${entry.stepNumber}` : "Step number: not provided by older data");
          if (entry.key) lines.push(`Mapping: ${entry.key}`);
          lines.push(`Item snapshot: ${entry.snapshotId || snapshotId}`);
          if (entry.source) {
            lines.push(`Source: ${entry.source.path || "Unknown path"} ${formatLines(entry.source.lines)}`);
            lines.push(`Source version: ${entry.sourceVersion || entry.source.sourceVersion || "Unknown"}`);
            lines.push(`Anchor: ${entry.source.anchor || "Unknown"}`);
          }
          lines.push(`Note:\n${entry.text || ""}`, "");
        }
        return lines.join("\n");
      }

      function currentFeedbackEntries() {
        const entries = [];
        for (const { item } of allItems("spec").concat(allItems("plan"), allItems("todo"))) {
          const value = item.stableKey && state.comments.get(item.stableKey);
          if (value && String(value.text || "").trim()) entries.push({ item, text: value.text, snapshotId: DATA.snapshotId, sourceVersion: item.source && item.source.sourceVersion });
        }
        return entries;
      }

      function renderFeedback() {
        const panel = make("section", "feedback-panel");
        const header = make("div", "feedback-header");
        header.appendChild(make("h2", "", "All feedback"));
        const copy = make("button", "action-button primary", "Copy for LLM");
        copy.type = "button";
        copy.id = "copy-feedback";
        header.appendChild(copy);
        panel.append(header, make("p", "muted", "Only notes from the current snapshot are included. Each entry includes a Spec ID or step, source, and snapshot identifier."));
        const list = make("div", "feedback-list");
        const entries = currentFeedbackEntries();
        if (!entries.length) list.appendChild(make("p", "empty-state", "No notes yet. Add one from any topic or step; blank notes are not exported."));
        else for (const entry of entries) {
          const article = make("article", "feedback-entry");
          article.append(make("h3", "", entry.item.title), make("span", "small-meta", `${labels[entry.item.kind]} · ${itemCaption(entry.item)} · ${entry.item.source.path || "Unknown path"}`), make("p", "", entry.text));
          list.appendChild(article);
        }
        panel.appendChild(list);
        const exportArea = document.createElement("textarea");
        exportArea.className = "feedback-export";
        exportArea.id = "feedback-export";
        exportArea.setAttribute("aria-label", "Full feedback for current snapshot");
        exportArea.readOnly = true;
        exportArea.value = exportEntries(entries.map((entry) => ({ key: entry.item.stableKey, snapshotId: entry.snapshotId, stepNumber: stepNumber(entry.item), itemId: entry.item.itemId, title: entry.item.title, docId: entry.item.source.docId, kind: entry.item.kind, sourceVersion: entry.sourceVersion, source: entry.item.source, text: entry.text })), DATA.snapshotId);
        panel.appendChild(exportArea);
        const copyStatus = make("p", "storage-state", "");
        copyStatus.id = "copy-status";
        panel.appendChild(copyStatus);
        const old = make("section", "old-snapshots");
        old.append(make("h3", "", "Notes from other snapshots"), make("p", "", "Older snapshots are excluded from the current export; only a read-only copy is provided."));
        const oldList = make("div", "old-list");
        const oldStatus = make("p", "storage-state", "");
        const oldExport = document.createElement("textarea");
        oldExport.className = "feedback-export old-export";
        oldExport.setAttribute("aria-label", "Full feedback for older snapshot");
        oldExport.readOnly = true;
        oldExport.rows = 5;
        oldExport.value = "Select an older snapshot to show its read-only notes here.";
        const snapshots = oldSnapshots();
        if (!snapshots.length) oldList.appendChild(make("span", "small-meta", "No recognizable notes from older snapshots"));
        for (const snapshot of snapshots) {
          const button = make("button", "action-button", `Select ${snapshot.snapshotId}`);
          button.type = "button";
          button.addEventListener("click", () => {
            oldExport.value = exportEntries(snapshot.entries, snapshot.snapshotId);
            oldExport.focus();
            oldExport.select();
            setText(oldStatus, "Older snapshot content selected; copy it manually.", "");
          });
          oldList.appendChild(button);
        }
        old.append(oldList, oldStatus, oldExport);
        panel.appendChild(old);
        copy.addEventListener("click", () => copyText(exportArea.value, exportArea, copyStatus));
        return panel;
      }

      function copyText(text, fallbackArea, statusNode) {
        const fallback = () => {
          fallbackArea.focus();
          fallbackArea.select();
          setText(statusNode, "Clipboard permission is unavailable. The full content is selected; copy it manually.", "");
        };
        if (!navigator.clipboard || typeof navigator.clipboard.writeText !== "function") {
          fallback();
          return;
        }
        try {
          Promise.resolve(navigator.clipboard.writeText(text)).then(() => setText(statusNode, "Copied.", "")).catch(fallback);
        } catch (error) {
          fallback();
        }
      }

      function renderFeedbackIfVisible() {
        if (state.view === "feedback" && !document.getElementById("notes-dialog").open) renderCurrentView();
      }

      function renderCurrentView() {
        renderTabs();
        const panel = document.getElementById("view-panel");
        panel.replaceChildren();
        if (state.view === "spec") panel.appendChild(renderSpec());
        else if (state.view === "plan-tasks") panel.appendChild(renderPlanTasks());
        else if (state.view === "plan" || state.view === "todo") panel.appendChild(renderWizard(state.view));
        else panel.appendChild(renderFeedback());
        fitSvgTextIn(panel);
        updateHeaderActions();
      }

      function renderDialogNote(item) {
        const host = make("div");
        host.appendChild(make("p", "muted", "This note belongs only to the current snapshot and this reading topic; it does not rewrite Markdown."));
        renderCommentEditor(host, item, "dialog-comment-input");
        return host;
      }

      function openDialog(mode, triggerId) {
        const dialog = document.getElementById("notes-dialog");
        const content = document.getElementById("dialog-content");
        state.dialogMode = mode;
        state.dialogTriggerId = triggerId;
        content.replaceChildren();
        if (mode === "note") {
          const item = state.selectedKey && byKey.get(state.selectedKey);
          if (!item) return;
          setText(document.getElementById("dialog-title"), "Notes for this item");
          setText(document.getElementById("dialog-subtitle"), `${item.title} · ${itemCaption(item)}`);
          content.appendChild(renderDialogNote(item));
        } else {
          setText(document.getElementById("dialog-title"), "All feedback");
          setText(document.getElementById("dialog-subtitle"), "Only the current snapshot is shown. Closing returns to the previous reading position.");
          content.appendChild(renderFeedback());
        }
        if (typeof dialog.showModal === "function") dialog.showModal();
        else dialog.setAttribute("open", "");
        const first = content.querySelector("textarea, button");
        if (first) first.focus();
      }

      function closeDialog() {
        const dialog = document.getElementById("notes-dialog");
        if (dialog.open && typeof dialog.close === "function") dialog.close();
        else {
          dialog.removeAttribute("open");
          restoreDialogFocus();
        }
      }

      function restoreDialogFocus() {
        const triggerId = state.dialogTriggerId;
        state.dialogMode = null;
        state.dialogTriggerId = null;
        const trigger = triggerId && document.getElementById(triggerId);
        if (trigger && !trigger.disabled) {
          trigger.focus();
          return;
        }
        if (state.view === "spec") focusSelectedMapNode();
      }

      const eyebrow = document.getElementById("page-eyebrow");
      const kinds = availableKinds();
      if (eyebrow) eyebrow.textContent = kinds.includes("plan") && kinds.includes("todo") ? "Plan + Todo integrated preview" : kinds.includes("plan") ? "Plan review preview" : kinds.includes("todo") ? "Todo review preview" : "Spec review preview";
      document.getElementById("page-title").textContent = DATA.title || "Document review";
      document.getElementById("page-summary").textContent = DATA.summary || "Understand the selected documents first, then leave verifiable notes.";
      document.getElementById("source-line").textContent = `${(DATA.documents || []).length} selected documents · read-only sources · no remote requests`;
      document.getElementById("snapshot-id").textContent = DATA.snapshotId || "Unknown";
      document.getElementById("source-root").textContent = DATA.sourceRoot || "Unknown";
      document.title = `${DATA.title || "Document review"} · visual-agent-docs`;
      document.getElementById("view-tabs").addEventListener("click", (event) => {
        const button = event.target.closest("button[data-view]");
        if (!button) return;
        state.view = button.dataset.view;
        state.lastList = null;
        renderCurrentView();
      });
      document.getElementById("feedback-shortcut").addEventListener("click", (event) => openDialog("feedback", event.currentTarget.id));
      document.getElementById("current-note-button").addEventListener("click", (event) => openDialog("note", event.currentTarget.id));
      document.getElementById("dialog-close").addEventListener("click", closeDialog);
      document.getElementById("notes-dialog").addEventListener("close", restoreDialogFocus);
      document.getElementById("view-panel").addEventListener("click", (event) => {
        const switchButton = event.target.closest("button[data-spec-view]");
        if (switchButton) {
          const workspace = document.querySelector(".spec-workspace");
          if (workspace) {
            workspace.dataset.mobileView = switchButton.dataset.specView;
            for (const button of workspace.querySelectorAll("button[data-spec-view]")) button.setAttribute("aria-selected", button.dataset.specView === workspace.dataset.mobileView ? "true" : "false");
            if (switchButton.dataset.specView === "map") focusSelectedMapNode();
            else focusDetailHeading();
          }
          return;
        }
        const target = event.target.closest("[data-key], [data-map-key]");
        if (!target || target.disabled) return;
        const key = target.dataset.key || target.dataset.mapKey;
        if (!key) return;
        selectItem(key, true);
      });
      document.getElementById("view-panel").addEventListener("keydown", (event) => {
        const target = event.target.closest(".graph-node[data-map-key]");
        if (!target || (event.key !== "Enter" && event.key !== " ")) return;
        event.preventDefault();
        selectItem(target.dataset.mapKey, true);
      });

      loadComments();
      renderNotices();
      renderCurrentView();
    })();
  </script>
</body>
</html>
