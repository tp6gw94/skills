<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GSAP visual explainer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --panel: #0d1b2d;
      --ink: #f4f8ff;
      --muted: #9db0c9;
      --accent: #58e0c2;
      --accent-2: #7aa7ff;
      --safe: clamp(24px, 5vw, 72px);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 0%, #142946 0, var(--bg) 58%);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button { font: inherit; }

    .shell { width: min(100%, 1280px); padding: 16px; }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      container-type: inline-size;
      overflow: hidden;
      border: 1px solid rgb(255 255 255 / 10%);
      border-radius: 22px;
      background: linear-gradient(145deg, rgb(255 255 255 / 4%), transparent 42%), var(--panel);
      box-shadow: 0 24px 80px rgb(0 0 0 / 38%);
    }

    /* The player toggles [hidden]. Keep it effective over any custom display rule. */
    [hidden] { display: none !important; }

    .scene {
      position: absolute;
      inset: 0;
    }

    .sample-layout {
      display: grid;
      align-content: center;
      gap: 4%;
      padding: 5.5cqw;
    }

    .eyebrow {
      margin: 0;
      color: var(--accent);
      font-size: clamp(8px, 1.5cqw, 20px);
      font-weight: 750;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1, h2 {
      max-width: 15ch;
      margin: 0;
      font-size: 6.5cqw;
      line-height: 0.98;
      letter-spacing: -0.045em;
    }

    h2 { font-size: 5.5cqw; }

    .lede {
      max-width: 46ch;
      margin: 0;
      color: var(--muted);
      font-size: clamp(8px, 2.2cqw, 28px);
      line-height: 1.45;
    }

    .diagram { width: min(100%, 880px); height: auto; overflow: visible; }
    .node rect { fill: #122942; stroke: rgb(255 255 255 / 16%); stroke-width: 2; }
    .node text {
      fill: var(--ink);
      font: 700 26px/1 ui-sans-serif, system-ui, sans-serif;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .connector { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      padding-top: 12px;
    }

    .controls button {
      min-width: 44px;
      min-height: 44px;
      border: 1px solid rgb(255 255 255 / 14%);
      border-radius: 12px;
      background: #12233a;
      color: var(--ink);
      cursor: pointer;
    }

    .controls button:hover, .controls button:focus-visible {
      border-color: var(--accent);
      outline: none;
    }

    .controls button:disabled { opacity: 0.45; cursor: not-allowed; }
    .controls button[aria-current="step"] { border-color: var(--accent); color: var(--accent); }

    .jump { display: flex; gap: 8px; }

    .progress {
      flex: 1;
      min-width: 100px;
      height: 7px;
      overflow: hidden;
      border-radius: 99px;
      background: rgb(255 255 255 / 10%);
    }

    .progress > span {
      display: block;
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }

    .status { min-height: 1.4em; margin: 8px 2px 0; color: var(--muted); font-size: 13px; }
    @media (max-width: 600px) {
      .progress { flex-basis: 100%; order: 1; }
      #restart { margin-left: auto; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="stage" aria-label="Animated visual explainer">
      <!-- Sample scene 1: replace with your claim. No timeline, so it shows complete. -->
      <article class="scene sample-layout" id="scene-claim" data-scene>
        <p class="eyebrow">Visual explainer</p>
        <h1>Replace this with the central claim.</h1>
        <p class="lede">Give the viewer one clear question to carry through the explanation.</p>
      </article>

      <!-- Sample scene 2: replace with your diagram. data-enter and data-draw are sample hooks. -->
      <article class="scene sample-layout" id="scene-mechanism" data-scene hidden aria-hidden="true">
        <p class="eyebrow">Build the model</p>
        <h2 data-enter>Show the relationship.</h2>
        <svg class="diagram" viewBox="0 0 900 280" role="img" aria-label="Three concepts connected in sequence">
          <path class="connector" data-draw d="M250 140 H365" />
          <path class="connector" data-draw d="M535 140 H650" />
          <g class="node" data-enter>
            <rect x="40" y="80" width="210" height="120" rx="22" />
            <text x="145" y="140">Input</text>
          </g>
          <g class="node" data-enter>
            <rect x="365" y="80" width="170" height="120" rx="22" />
            <text x="450" y="140">Idea</text>
          </g>
          <g class="node" data-enter>
            <rect x="650" y="80" width="210" height="120" rx="22" />
            <text x="755" y="140">Insight</text>
          </g>
        </svg>
      </article>

      <!-- Sample scene 3: replace with your conclusion. -->
      <article class="scene sample-layout" id="scene-conclusion" data-scene hidden aria-hidden="true">
        <p class="eyebrow">Conclusion</p>
        <h2>End with what changed.</h2>
        <p class="lede">State the new understanding and credit the source here.</p>
      </article>

      <noscript>This explainer needs JavaScript for playback.</noscript>
    </section>

    <nav class="controls" aria-label="Playback controls">
      <button id="previous" type="button">Previous</button>
      <button id="toggle" type="button" aria-pressed="false">Play</button>
      <button id="next" type="button">Next</button>
      <div class="jump" role="group" aria-label="Jump to scene">
        <button type="button" data-jump="0">1</button>
        <button type="button" data-jump="1">2</button>
        <button type="button" data-jump="2">3</button>
      </div>
      <div class="progress" role="progressbar" aria-label="Playback progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span id="progressBar"></span>
      </div>
      <button id="restart" type="button">Restart</button>
    </nav>
    <p class="status" id="status" aria-live="polite"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <!-- Packaged utilities. assemble.mjs replaces these markers with inline scripts.
       The relative src paths let this file also run directly from assets/. -->
  <script data-explainer-util="player" src="./player.js"></script>
  <script data-explainer-util="animations" src="./animation-helpers.js"></script>
  <script>
    (function () {
      // Sample timeline factory: replace with your own authored GSAP timeline.
      function mechanismTimeline(context) {
        var timeline = context.gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });
        context.animation.reveal(timeline, context.element.querySelectorAll("[data-enter]"), {
          at: 0.2, duration: 0.6, stagger: 0.12, dy: 26
        });
        context.animation.draw(timeline, context.element.querySelectorAll("[data-draw]"), {
          at: 1.1, duration: 0.9, stagger: 0.45
        });
        timeline.to({}, { duration: 0.8 });
        return timeline;
      }

      window.explainer = window.ExplainerPlayer.create({
        scenes: [
          { element: document.querySelector("#scene-claim"), title: "The claim" },
          { element: document.querySelector("#scene-mechanism"), title: "The mechanism", createTimeline: mechanismTimeline },
          { element: document.querySelector("#scene-conclusion"), title: "Conclusion" }
        ],
        controls: {
          previous: document.querySelector("#previous"),
          next: document.querySelector("#next"),
          restart: document.querySelector("#restart"),
          toggle: document.querySelector("#toggle"),
          progress: document.querySelector("#progressBar"),
          status: document.querySelector("#status"),
          jump: document.querySelectorAll("[data-jump]")
        },
        // Override any label key to localize the viewer's language.
        labels: {},
        // Example authored sync: mirror the current scene title into the tab title.
        onSceneChange: function (state) {
          document.title = state.title ? state.title + " - GSAP explainer" : "GSAP explainer";
        }
      });
    })();
  </script>
</body>
</html>
